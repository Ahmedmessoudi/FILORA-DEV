# ─── Filora DMS — Application Configuration ───
spring:
  application:
    name: Filora

  # ─── PostgreSQL DataSource ───
  datasource:
    url: jdbc:postgresql://${SYSTEM_DB_HOST}:${SYSTEM_DB_PORT}/${SYSTEM_DB_NAME}
    username: ${SYSTEM_DB_USERNAME}
    password: ${SYSTEM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ─── JPA / Hibernate ───
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ─── File Upload ───
  servlet:
    multipart:
      enabled: true
      max-file-size: ${SYSTEM_MAX_FILE_SIZE}KB
      max-request-size: 10MB

  # ─── SMTP ───
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_EMAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ─── Server ───
server:
  port: 8080

# ─── Custom Filora Properties ───
filora:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES}
  security:
    two-factor-enabled: ${TWO_FACTOR_ENABLED}
    two-factor-method: ${TWO_FACTOR_METHOD}
    max-login-attempts: ${SYSTEM_MAX_LOGIN_ATTEMPTS}
    lockout-duration-minutes: ${SYSTEM_LOCKOUT_DURATION_MINUTES}
  storage:
    data-path: ${ENTITIES_DATA_PATH}
    logs-path: ${SYSTEM_LOGS_PATH}
  ocr:
    service-url: ${OCR_SERVICE_URL}
    confidence-threshold: ${OCR_CONFIDENCE_THRESHOLD}
  system:
    name: ${SYSTEM_NAME}
    enabled: ${SYSTEM_ENABLED}
    max-users: ${SYSTEM_MAX_USERS}
    max-entities: ${SYSTEM_MAX_ENTITIES}
    max-external-entities: ${SYSTEM_MAX_EXTERNAL_ENTITIES}
    max-file-size: ${SYSTEM_MAX_FILE_SIZE}
    table-page-size: ${SYSTEM_TABLE_PAGE_SIZE}
    currency: ${CURRENCY}
    default-language: ${DEFAULT_LANGUAGE}
    supported-languages: ${SUPPORTED_LANGUAGES}
  frontend:
    url: ${FRONTEND_URL}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_EMAIL}
    password: ${SMTP_PASSWORD}
